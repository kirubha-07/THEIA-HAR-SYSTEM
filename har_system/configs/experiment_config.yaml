experiment:
  name: "ISRO Sample Experiment"
  description: "Red-Yellow Module Extraction Sequence"
  context_objects:
    - tray
  display_names:
    red_box: "red module"
    yellow_box: "yellow module"
    tray: "tray"
  steps:
    - id: 1
      name: "Grasp red module"
      description: "Take the red module out of the tray"
      trigger:
        action: grasp
        object: red_box
      success_message: "Step 1 complete. Red module secured."
      next_hint: "Hint: Take the red module out of the tray"

    - id: 2
      name: "Grasp yellow module"
      description: "Take the yellow module out of the tray"
      trigger:
        action: grasp
        object: yellow_box
      success_message: "Step 2 complete. Yellow module secured."
      next_hint: "Hint: Take the yellow module out of the tray"

    - id: 3
      name: "Return red module"
      description: "Pick up the red module again to return it"
      trigger:
        action: grasp
        object: red_box
      success_message: "Step 3 complete. Experiment sequence validated."
      next_hint: "Hint: Pick up the red module again"
